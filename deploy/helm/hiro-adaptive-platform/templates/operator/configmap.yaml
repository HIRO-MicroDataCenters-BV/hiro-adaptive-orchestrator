{{- $op := index .Values "hiro-operator" }}
{{- if $op.enabled }}
{{- if $op.manager.env }}
{{- fail "hiro-operator.manager.env must stay empty: an inline entry silently overrides the same key in hiro-operator.config (loaded via envFrom). Move the setting into hiro-operator.config." }}
{{- end }}
{{- if $op.manager.envOverrides }}
{{- fail "hiro-operator.manager.envOverrides is no longer used; set the key in hiro-operator.config instead (--set hiro-operator.config.KEY=value)." }}
{{- end }}
{{- $cfg := deepCopy ($op.config | default dict) }}
{{- if and (hasKey $cfg "PLACEMENT_SERVER_PORT") (not (has (toString (get $cfg "PLACEMENT_SERVER_PORT")) (list ":8090" "8090"))) }}
{{- fail "hiro-operator.config.PLACEMENT_SERVER_PORT must be :8090 — the placement Service generated by the operator subchart is fixed to that port." }}
{{- end }}
{{- /* Derived from the features that need them, so one flag is enough. */}}
{{- $_ := set $cfg "ENABLE_WEBHOOKS" (ternary "true" "false" (.Values.webhook.enable | default false)) }}
{{- $_ := set $cfg "HIRO_SCHEDULER_NAME" .Values.scheduler.plugin.schedulerName }}
# Name is fixed: config/manager/manager.yaml references it by name in envFrom.
apiVersion: v1
kind: ConfigMap
metadata:
  name: hiro-operator-config
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: hiro-operator
    app.kubernetes.io/component: operator-config
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  {{- range $k, $v := $cfg }}
  {{ $k }}: {{ $v | toString | quote }}
  {{- end }}
{{- end }}
