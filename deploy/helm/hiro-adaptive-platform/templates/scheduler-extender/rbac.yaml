{{- /*
NOT gated by scheduler.mode == "extender" like the rest of
templates/scheduler-extender/ — the restore/cleanup hook Jobs
(job-restore-kube-scheduler.yaml) need this ServiceAccount to still exist
when switching AWAY from extender mode (mode is something else by then,
that's the pre-upgrade hook case). RBAC is cheap and harmless to always
render regardless of mode, so keeping it unconditional avoids having to
keep two different gating conditions in sync.
*/}}
# One ServiceAccount shared by all extender-related hook Jobs (prep, patch,
# verify, restore, cleanup). Lives in kube-system, not this release's own
# namespace — every one of those Jobs' Pods runs in kube-system (they patch
# the control-plane's kube-scheduler), and a Pod's serviceAccountName can
# only resolve a ServiceAccount that exists in the Pod's own namespace.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-hiro-extender
  namespace: kube-system
  labels:
    app.kubernetes.io/name: hiro-extender
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/instance: {{ .Release.Name }}
---
# Prep Job: resolve the PlacementServer Service's ClusterIP (by label
# selector, in this release's own namespace) — cross-namespace subject
# reference to the kube-system ServiceAccount above (a RoleBinding may bind
# a subject from any namespace; only a Pod's serviceAccountName cannot).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-hiro-extender
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: hiro-extender
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/instance: {{ .Release.Name }}
rules:
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-hiro-extender
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: hiro-extender
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/instance: {{ .Release.Name }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-hiro-extender
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-hiro-extender
    namespace: kube-system
---
# Prep Job (create/update the two ConfigMaps) and wait/verify Job (poll the
# kube-scheduler pod for its restart) both need access in kube-system too —
# same-namespace binding now that the ServiceAccount itself lives here.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-hiro-extender
  namespace: kube-system
  labels:
    app.kubernetes.io/name: hiro-extender
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/instance: {{ .Release.Name }}
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "create", "update", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-hiro-extender
  namespace: kube-system
  labels:
    app.kubernetes.io/name: hiro-extender
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/instance: {{ .Release.Name }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-hiro-extender
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-hiro-extender
    namespace: kube-system
