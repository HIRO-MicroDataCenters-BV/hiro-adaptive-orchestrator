    app.kubernetes.io/component: placement-server
    app.kubernetes.io/name: hiro-adaptive-orchestrator
    control-plane: controller-manager
  name: hiro-adaptive-orchestrator-controller-manager-placement-service
  namespace: hiro-adaptive-orchestrator-system
spec:
  ports:
  - name: placement-api
    port: 8090
    protocol: TCP
    targetPort: 8090
  selector:
    app.kubernetes.io/name: hiro-adaptive-orchestrator
    control-plane: controller-manager
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: hiro-adaptive-orchestrator
    control-plane: controller-manager
  name: hiro-adaptive-orchestrator-controller-manager
  namespace: hiro-adaptive-orchestrator-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: hiro-adaptive-orchestrator
      control-plane: controller-manager
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
      labels:
        app.kubernetes.io/name: hiro-adaptive-orchestrator
        control-plane: controller-manager
    spec:
      containers:
      - args:
        - --metrics-bind-address=:8443
        - --leader-elect
        - --health-probe-bind-address=:8081
        command:
        - /manager
        env:
        - name: DECISION_AGENT_URL
          value: http://mock-decision-agent:8080
        - name: DECISION_AGENT_PATH
          value: /api/v1/agent/placement/decision
        - name: PLACEMENT_SERVER_PORT
          value: :8090
        - name: PLACEMENT_SCORE_PATH
          value: /api/v1/placement/score
        - name: PLACEMENT_FILTER_PATH
          value: /api/v1/placement/filter
        - name: PLACEMENT_SERVER_HEALTH_PATH
          value: /healthz
        - name: EAO_GROUP
          value: eas.hiro.io
        - name: EAO_VERSION
          value: v1
        - name: EAO_KIND
          value: EnergyAwareOrchestration
        - name: EXTENDER_FILTER_PATH
          value: /extender/filter
        - name: EXTENDER_PRIORITIZE_PATH
          value: /extender/prioritize
        - name: REBALANCE_HISTORY_WINDOW
          value: 1h
        - name: REBALANCE_HISTORY_MAX_ENTRIES
          value: "20"
        - name: REBALANCE_HISTORY_MESSAGE_MAX
          value: "200"
        - name: REBALANCE_DETECTION_INTERVAL
          value: 30s
        - name: REBALANCE_DECISION_TIMEOUT
          value: 5s
        - name: REBALANCE_NODE_PRESSURE_THRESHOLD
          value: "0.90"
        - name: REBALANCE_IMPROVEMENT_THRESHOLD
          value: "20"
        - name: REBALANCE_DECISION_STORE_TTL
          value: 60s
        - name: REBALANCE_MOVE_ACTION_TIMEOUT
          value: 60s
        - name: REBALANCE_MOVE_RATE_LIMIT
          value: "5"
        - name: REBALANCE_SCALE_ACTION_TIMEOUT
          value: 60s
        - name: REBALANCE_MIN_REPLICAS
          value: "1"
        - name: REBALANCE_MAX_REPLICAS
          value: "10"
        - name: REBALANCE_RESOURCE_ACTION_TIMEOUT
          value: 60s
        - name: REBALANCE_MIN_CPU
          value: 50m
        - name: REBALANCE_MAX_CPU
          value: "2"
        - name: REBALANCE_MIN_MEMORY
          value: 64Mi
        - name: REBALANCE_MAX_MEMORY
          value: 2Gi
        - name: REBALANCE_WATCHDOG_STALE_THRESHOLD
          value: 15m
        - name: ENABLE_WEBHOOKS
          value: "false"
        - name: HIRO_SCHEDULER_NAME
          value: hiro-scheduler
        envFrom:
        - configMapRef:
            name: hiro-operator-config
            optional: true
        image: ghcr.io/hiro-microdatacenters-bv/hiro-adaptive-orchestrator/hiro-adaptive-orchestrator-controller:latest
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        name: manager
        ports:
        - containerPort: 8090
          name: placement-srv
          protocol: TCP
        - containerPort: 8081
          name: health-probe
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          limits:
            cpu: 500m
            memory: 128Mi
          requests:
            cpu: 10m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts: []
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
