apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: orchestrationprofiles.orchestration.hiro.io
spec:
  group: orchestration.hiro.io
  names:
    kind: OrchestrationProfile
    listKind: OrchestrationProfileList
    plural: orchestrationprofiles
    shortNames:
    - op
    singular: orchestrationprofile
  scope: Cluster
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: OrchestrationProfile is the Schema for the orchestrationprofiles
          API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of OrchestrationProfile
            properties:
              applicationRef:
                description: |-
                  applicationRef references the application for which this orchestration profile is defined.
                  Immutable: the profile's status describes this one application for its whole life.
                properties:
                  apiVersion:
                    type: string
                  kind:
                    description: ApplicationKind enumerates the workload kinds an
                      OrchestrationProfile can reference.
                    enum:
                    - Deployment
                    - StatefulSet
                    - ReplicaSet
                    - Job
                    type: string
                  name:
                    type: string
                  namespace:
                    type: string
                required:
                - apiVersion
                - kind
                - name
                - namespace
                type: object
                x-kubernetes-validations:
                - message: applicationRef is immutable; create a new OrchestrationProfile
                    for a different application
                  rule: self == oldSelf
              placement:
                description: placement defines the placement strategy and awareness
                  for the application.
                properties:
                  awareness:
                    description: Placement Awareness
                    properties:
                      cpu:
                        type: boolean
                      energy:
                        type: boolean
                      gpu:
                        type: boolean
                      memory:
                        type: boolean
                    type: object
                  strategy:
                    description: PlacementStrategy enumerates the supported placement
                      strategies.
                    enum:
                    - Balanced
                    - Packed
                    - Spread
                    type: string
                required:
                - strategy
                type: object
              rebalancing:
                description: rebalancing defines the rebalancing strategy for the
                  application.
                properties:
                  cooldownSeconds:
                    type: integer
                  dryRun:
                    type: boolean
                  enabled:
                    type: boolean
                  escalationThreshold:
                    description: |-
                      escalationThreshold is how many consecutive Failed/Deferred decision
                      cycles this workload may have before the rebalance loop escalates and
                      pauses itself. <= 0 uses DefaultEscalationThreshold.
                    format: int32
                    type: integer
                  replicasExternallyManaged:
                    description: replicasExternallyManaged means something outside
                      this operator owns the replica count; it is never changed.
                    type: boolean
                  resourcesExternallyManaged:
                    description: resourcesExternallyManaged means something outside
                      this operator owns container CPU/memory; they are never changed.
                    type: boolean
                  triggerConditions:
                    items:
                      description: TriggerCondition enumerates the supported rebalancing
                        trigger conditions.
                      enum:
                      - CPUThreshold
                      - MemoryThreshold
                      - EnergyThreshold
                      - NodeFailure
                      - Scheduled
                      type: string
                    type: array
                required:
                - enabled
                type: object
            required:
            - applicationRef
            - placement
            type: object
          status:
            description: status defines the observed state of OrchestrationProfile
            properties:
              conditions:
                description: conditions represent the latest available observations
                  of the profile's state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              lastUpdatedTime:
                format: date-time
                type: string
              observedGeneration:
                description: observedGeneration is the .metadata.generation last processed
                  by the controller.
                format: int64
                type: integer
              placementStatus:
                description: placementStatus provides details about the current placement
                  of the application.
                properties:
                  failedPods:
                    type: integer
                  observedPods:
                    type: integer
                  pendingPods:
                    type: integer
                  podStatuses:
                    items:
                      description: Pod Status
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                        namespace:
                          type: string
                        nodeName:
                          type: string
                        reason:
                          type: string
                        status:
                          type: string
                      type: object
                    type: array
                  readyPods:
                    type: integer
                  strategy:
                    type: string
                type: object
              reason:
                description: reason provides additional details when the status is
                  not "Active" (e.g., error messages).
                type: string
              rebalancingStatus:
                description: rebalancingStatus provides details about the current
                  rebalancing state of the application.
                properties:
                  action:
                    description: |-
                      action is the AI-returned action being processed for the current cycle
                      (e.g. "Move", "NoOp"). Empty before the AI has responded.
                    type: string
                  consecutiveFailures:
                    description: |-
                      consecutiveFailures counts terminal Failed/Deferred outcomes in a row,
                      reset by any other outcome. Crossing escalationThreshold sets escalated.
                    format: int32
                    type: integer
                  cooldownUntil:
                    description: |-
                      cooldownUntil blocks new Triggered transitions for this workload until
                      this time has passed.
                    format: date-time
                    type: string
                  decisionId:
                    description: decisionId correlates the current cycle with engine
                      logs and Kubernetes Events.
                    type: string
                  details:
                    description: |-
                      details carries free-form, state-specific context for the current cycle
                      (e.g. target node, improvement score, dry-run marker).
                    type: string
                  escalated:
                    description: |-
                      escalated, when true, pauses the rebalance loop for this workload
                      entirely until cleared — set when consecutiveFailures crosses
                      escalationThreshold, or when the AI itself returns action "Escalate".
                      Never cleared automatically; see escalatedReason for why it was set.
                    type: boolean
                  escalatedReason:
                    description: |-
                      escalatedReason explains why escalated was set. Only meaningful while
                      escalated is true.
                    type: string
                  history:
                    description: |-
                      history holds recent terminal decisions, newest first, within the history window and size cap.
                      Repeats are merged so they can't push out real actions.
                    items:
                      description: HistoryEntry is one terminal decision, or a run
                        of identical ones (count > 1).
                      properties:
                        action:
                          description: 'action has no enum: the AI may return new
                            actions.'
                          type: string
                        at:
                          format: date-time
                          type: string
                        container:
                          description: AdjustResources facts.
                          type: string
                        count:
                          description: count is how many identical decisions in a
                            row this entry stands for; unset means 1.
                          format: int32
                          type: integer
                        decidedBy:
                          description: decidedBy is who answered (e.g. mock, rules,
                            model); empty when no agent was asked.
                          type: string
                        firstAt:
                          description: firstAt is when the first of the merged decisions
                            ended; at is the latest.
                          format: date-time
                          type: string
                        fromCpu:
                          type: string
                        fromMemory:
                          type: string
                        fromReplicas:
                          description: AdjustReplicas facts.
                          format: int32
                          type: integer
                        message:
                          description: message is the human-readable detail, truncated
                            to a configured length.
                          type: string
                        newPodName:
                          type: string
                        newPodNode:
                          type: string
                        outcome:
                          description: 'RebalanceOutcome is how a decision cycle ended.
                            Not a CRD enum: only the operator writes it.'
                          type: string
                        podName:
                          description: Move facts. newPodName/newPodNode are set whenever
                            a replacement pod appeared.
                          type: string
                        reason:
                          description: reason is a short CamelCase code for where
                            the cycle ended; not an enum, so new codes need no CRD
                            change.
                          type: string
                        sourceNode:
                          type: string
                        targetNode:
                          type: string
                        toCpu:
                          type: string
                        toMemory:
                          type: string
                        toReplicas:
                          format: int32
                          type: integer
                        trigger:
                          description: trigger is the condition that started the cycle,
                            so each trigger can read its own tries.
                          enum:
                          - CPUThreshold
                          - MemoryThreshold
                          - EnergyThreshold
                          - NodeFailure
                          - Scheduled
                          type: string
                      required:
                      - action
                      - at
                      - outcome
                      - reason
                      type: object
                    type: array
                  lastTransitionAt:
                    description: lastTransitionAt is when state last changed.
                    format: date-time
                    type: string
                  reason:
                    description: reason explains why the current state was entered.
                    type: string
                  startedAt:
                    description: startedAt is when the current cycle entered Triggered.
                    format: date-time
                    type: string
                  state:
                    description: |-
                      state is the current position of this workload's decision lifecycle
                      state machine. Empty when no rebalance cycle has ever been triggered.
                    enum:
                    - Watching
                    - Triggered
                    - Evaluating
                    - Decided
                    - Enacting
                    type: string
                  trigger:
                    description: trigger is the trigger condition that started the
                      current cycle.
                    enum:
                    - CPUThreshold
                    - MemoryThreshold
                    - EnergyThreshold
                    - NodeFailure
                    - Scheduled
                    type: string
                type: object
              status:
                description: status indicates the status of the orchestration profile.
                enum:
                - NoPods
                - Partial
                - Active
                - Pending
                - Degraded
                - Error
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
