## String to partially override chart.fullname template (will maintain the release name)
##
# nameOverride: ""

## String to fully override chart.fullname template
##
# fullnameOverride: ""

## Configure the controller manager deployment
##
manager:
  ## Set to false to skip manager installation
  ##
  enabled: true

  replicas: 1

  image:
    repository: ghcr.io/hiro-microdatacenters-bv/hiro-adaptive-orchestrator/hiro-adaptive-orchestrator-controller
    ## Image tag (defaults to Chart.appVersion if not set)
    ##
    # tag: ""
    pullPolicy: IfNotPresent

  ## Arguments
  ##
  args:
    - --leader-elect

  ## Health probes.
  ## The manager serves the liveness (/healthz) and readiness (/readyz) endpoints on this port.
  ##
  healthProbe:
    # Health probe server port
    port: 8081

  ## Environment variables
  ##
  env:
    - name: DECISION_AGENT_URL
      value: http://mock-decision-agent:8080
    - name: DECISION_AGENT_PATH
      value: /api/v1/agent/placement/decision
    - name: DECISION_AGENT_TIMEOUT
      value: 8s
    - name: PLACEMENT_SERVER_PORT
      value: :8090
    - name: PLACEMENT_SERVER_REQUEST_TIMEOUT
      value: 10s
    - name: PLACEMENT_SCORE_PATH
      value: /api/v1/placement/score
    - name: PLACEMENT_FILTER_PATH
      value: /api/v1/placement/filter
    - name: PLACEMENT_SERVER_HEALTH_PATH
      value: /healthz
    - name: EAO_GROUP
      value: eas.hiro.io
    - name: EAO_VERSION
      value: v1
    - name: EAO_KIND
      value: EnergyAwareOrchestration
    - name: EXTENDER_FILTER_PATH
      value: /extender/filter
    - name: EXTENDER_PRIORITIZE_PATH
      value: /extender/prioritize
    - name: REBALANCE_HISTORY_WINDOW
      value: 1h
    - name: REBALANCE_HISTORY_MAX_ENTRIES
      value: "20"
    - name: REBALANCE_HISTORY_MESSAGE_MAX
      value: "200"
    - name: REBALANCE_DETECTION_INTERVAL
      value: 30s
    - name: REBALANCE_DECISION_TIMEOUT
      value: 5s
    - name: REBALANCE_NODE_PRESSURE_THRESHOLD
      value: "0.90"
    - name: REBALANCE_IMPROVEMENT_THRESHOLD
      value: "20"
    - name: REBALANCE_DECISION_STORE_TTL
      value: 60s
    - name: REBALANCE_MOVE_ACTION_TIMEOUT
      value: 60s
    - name: REBALANCE_MOVE_RATE_LIMIT
      value: "5"
    - name: REBALANCE_SCALE_ACTION_TIMEOUT
      value: 60s
    - name: REBALANCE_MIN_REPLICAS
      value: "1"
    - name: REBALANCE_MAX_REPLICAS
      value: "10"
    - name: REBALANCE_RESOURCE_ACTION_TIMEOUT
      value: 60s
    - name: REBALANCE_MIN_CPU
      value: 50m
    - name: REBALANCE_MAX_CPU
      value: "2"
    - name: REBALANCE_MIN_MEMORY
      value: 64Mi
    - name: REBALANCE_MAX_MEMORY
      value: 2Gi
    - name: REBALANCE_WATCHDOG_STALE_THRESHOLD
      value: 15m
    - name: REBALANCE_MIN_PENDING_POD_AGE
      value: 10s
    - name: ENABLE_WEBHOOKS
      value: "false"
    - name: HIRO_SCHEDULER_NAME
      value: hiro-scheduler

  ## Env overrides (--set manager.envOverrides.VAR=value)
  ## Same name in env above: this value takes precedence.
  ##
  envOverrides: {}

  ## Image pull secrets
  ##
  # imagePullSecrets:
  #   - name: myregistrykey

  ## Pod-level security settings
  ##
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault

  ## Container-level security settings
  ##
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
      - ALL
    readOnlyRootFilesystem: true

  ## Resource limits and requests
  ##
  resources:
    limits:
      cpu: 500m
      memory: 128Mi
    requests:
      cpu: 10m
      memory: 64Mi

  ## Manager pod's affinity
  ##
  affinity: {}

  ## Manager pod's node selector
  ##
  nodeSelector: {}

  ## Manager pod's tolerations
  ##
  tolerations: []

  ## Deployment strategy
  ##
  # strategy:
  #   type: RollingUpdate
  #   rollingUpdate:
  #     maxSurge: 25%
  #     maxUnavailable: 25%

  ## Priority class name
  ##
  # priorityClassName: ""

  ## Topology spread constraints
  ##
  # topologySpreadConstraints: []

  ## Termination grace period seconds
  ##
  terminationGracePeriodSeconds: 10

  ## Custom Deployment labels
  ##
  # labels: {}

  ## Custom Deployment annotations
  ##
  # annotations: {}

  ## Custom Pod labels and annotations
  ##
  # pod:
  #   labels: {}
  #   annotations: {}

## RBAC configuration
##
rbac:
  ## RBAC resource scope
  ## - false (default): ClusterRole/ClusterRoleBinding (all namespaces)
  ## - true: Role/RoleBinding (release namespace only)
  ##
  namespaced: false

  ## Helper roles for CRD management (admin/editor/viewer)
  ##
  helpers:
    ## Install convenience admin/editor/viewer roles for CRDs
    ##
    enabled: false

## ServiceAccount configuration
##
serviceAccount:
  # Install default ServiceAccount provided
  enabled: true

  ## Existing ServiceAccount name (required when enabled=false)
  ## Set to "default" to use the namespace default ServiceAccount
  ## Note: When enabled=true, respects nameOverride/fullnameOverride
  ##
  # name: ""

  ## Custom ServiceAccount annotations
  ##
  # annotations: {}

  ## Custom ServiceAccount labels
  ##
  # labels: {}

## Custom Resource Definitions
##
crd:
  # Install CRDs with the chart
  enabled: true
  # Keep CRDs when uninstalling
  keep: true

## Controller metrics endpoint.
## Enable to expose /metrics endpoint
##
metrics:
  enabled: true
  # Metrics server port
  port: 8443
  # Enable secure metrics: HTTPS with certs/auth (true) or HTTP (false).
  # Note: Metrics authn/authz needs ClusterRole access.
  secure: true

## Cert-manager integration for TLS certificates.
## Required for webhook certificates and metrics endpoint certificates.
##
certManager:
  enabled: false

## Webhook server configuration
##
webhook:
  enabled: false
  # Webhook server port
  port: 9443

## Prometheus ServiceMonitor for metrics scraping.
## Requires prometheus-operator to be installed in the cluster.
##
prometheus:
  enabled: false

  ## Custom ServiceMonitor labels
  ##
  # labels: {}

  ## Custom ServiceMonitor annotations
  ##
  # annotations: {}

## Network policies for controlling traffic flow.
## Enable to restrict ingress to the controller manager.
##
networkPolicy:
  enabled: false

