{{- if .Values.crd.enable }}
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
    annotations:
        {{- if .Values.crd.keep }}
        "helm.sh/resource-policy": keep
        {{- end }}
        controller-gen.kubebuilder.io/version: v0.20.1
    name: orchestrationprofiles.orchestration.hiro.io
spec:
    group: orchestration.hiro.io
    names:
        kind: OrchestrationProfile
        listKind: OrchestrationProfileList
        plural: orchestrationprofiles
        shortNames:
            - op
        singular: orchestrationprofile
    scope: Cluster
    versions:
        - name: v1alpha1
          schema:
            openAPIV3Schema:
                description: OrchestrationProfile is the Schema for the orchestrationprofiles API
                properties:
                    apiVersion:
                        description: |-
                            APIVersion defines the versioned schema of this representation of an object.
                            Servers should convert recognized schemas to the latest internal value, and
                            may reject unrecognized values.
                            More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
                        type: string
                    kind:
                        description: |-
                            Kind is a string value representing the REST resource this object represents.
                            Servers may infer this from the endpoint the client submits requests to.
                            Cannot be updated.
                            In CamelCase.
                            More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
                        type: string
                    metadata:
                        type: object
                    spec:
                        description: spec defines the desired state of OrchestrationProfile
                        properties:
                            applicationRef:
                                description: applicationRef references the application for which this orchestration profile is defined.
                                properties:
                                    apiVersion:
                                        type: string
                                    kind:
                                        type: string
                                    name:
                                        type: string
                                    namespace:
                                        type: string
                                required:
                                    - apiVersion
                                    - kind
                                    - name
                                    - namespace
                                type: object
                            placement:
                                description: placement defines the placement strategy and awareness for the application.
                                properties:
                                    awareness:
                                        description: Placement Awareness
                                        properties:
                                            cpu:
                                                type: boolean
                                            energy:
                                                type: boolean
                                            gpu:
                                                type: boolean
                                            memory:
                                                type: boolean
                                        type: object
                                    strategy:
                                        type: string
                                required:
                                    - strategy
                                type: object
                            rebalancing:
                                description: rebalancing defines the rebalancing strategy for the application.
                                properties:
                                    cooldownSeconds:
                                        type: integer
                                    dryRun:
                                        type: boolean
                                    enabled:
                                        type: boolean
                                    triggerConditions:
                                        items:
                                            type: string
                                        type: array
                                required:
                                    - enabled
                                type: object
                        required:
                            - applicationRef
                            - placement
                        type: object
                    status:
                        description: status defines the observed state of OrchestrationProfile
                        properties:
                            lastUpdatedTime:
                                format: date-time
                                type: string
                            placementStatus:
                                description: placementStatus provides details about the current placement of the application.
                                properties:
                                    failedPods:
                                        type: integer
                                    observedPods:
                                        type: integer
                                    pendingPods:
                                        type: integer
                                    podStatuses:
                                        items:
                                            description: Pod Status
                                            properties:
                                                id:
                                                    type: string
                                                name:
                                                    type: string
                                                namespace:
                                                    type: string
                                                nodeName:
                                                    type: string
                                                reason:
                                                    type: string
                                                status:
                                                    type: string
                                            type: object
                                        type: array
                                    readyPods:
                                        type: integer
                                    strategy:
                                        type: string
                                type: object
                            reason:
                                description: reason provides additional details when the status is not "Active" (e.g., error messages).
                                type: string
                            rebalancingStatus:
                                description: rebalancingStatus provides details about the current rebalancing state of the application.
                                properties:
                                    action:
                                        description: |-
                                            action is the AI-returned action being processed for the current cycle
                                            (e.g. "Move", "NoOp"). Empty before the AI has responded.
                                        type: string
                                    cooldownUntil:
                                        description: |-
                                            cooldownUntil blocks new Triggered transitions for this workload until
                                            this time has passed.
                                        format: date-time
                                        type: string
                                    decisionId:
                                        description: decisionId correlates the current cycle with engine logs and Kubernetes Events.
                                        type: string
                                    details:
                                        description: |-
                                            details carries free-form, state-specific context for the current cycle
                                            (e.g. target node, improvement score, dry-run marker).
                                        type: string
                                    lastTransitionAt:
                                        description: lastTransitionAt is when state last changed.
                                        format: date-time
                                        type: string
                                    reason:
                                        description: reason explains why the current state was entered.
                                        type: string
                                    recentDecisions:
                                        description: |-
                                            recentDecisions is a rolling window of the most recent terminal
                                            outcomes, newest first, trimmed to a bounded length (default 10).
                                        items:
                                            description: |-
                                                RebalanceDecision is a single terminal-outcome record kept in the profile's
                                                rolling decision history.
                                            properties:
                                                action:
                                                    description: |-
                                                        action is the AI-returned action that was processed (e.g. "Move", "NoOp").
                                                        Dont use kubebuilder:validation:Enum here because the AI may return new actions in
                                                        the future, and we don't want to break the CRD schema for that reason.
                                                    type: string
                                                decisionId:
                                                    description: decisionId correlates this record with engine logs and Kubernetes Events.
                                                    type: string
                                                details:
                                                    description: |-
                                                        details carries free-form, state-specific context (e.g. target node,
                                                        improvement score, dry-run marker).
                                                    type: string
                                                lastTransitionAt:
                                                    description: lastTransitionAt is when this decision reached its terminal state.
                                                    format: date-time
                                                    type: string
                                                outcome:
                                                    description: outcome is the terminal outcome of this decision cycle.
                                                    enum:
                                                        - Enacted
                                                        - NoOp
                                                        - Rejected
                                                        - Deferred
                                                        - Failed
                                                    type: string
                                                reason:
                                                    description: reason explains why the decision ended in this state.
                                                    type: string
                                                startedAt:
                                                    description: startedAt is when this decision's cycle entered Triggered.
                                                    format: date-time
                                                    type: string
                                            required:
                                                - decisionId
                                            type: object
                                        type: array
                                    startedAt:
                                        description: startedAt is when the current cycle entered Triggered.
                                        format: date-time
                                        type: string
                                    state:
                                        description: |-
                                            state is the current position of this workload's decision lifecycle
                                            state machine. Empty when no rebalance cycle has ever been triggered.
                                        enum:
                                            - Watching
                                            - Triggered
                                            - Evaluating
                                            - Decided
                                            - Enacting
                                        type: string
                                type: object
                            status:
                                description: status indicates the status of the orchestration profile (e.g., "Pending", "Active", "Error", "InUse").
                                type: string
                        type: object
                required:
                    - spec
                type: object
          served: true
          storage: true
          subresources:
            status: {}
{{- end }}
