# Exists only so Prometheus has something to scrape — the scheduler serves no
# traffic of its own. kube-scheduler exposes /metrics on its secure port
# (10259), which is also where the health probes point.
apiVersion: v1
kind: Service
metadata:
  name: hiro-scheduler-metrics
  namespace: system
  labels:
    app: hiro-scheduler
    app.kubernetes.io/name: hiro-scheduler
    app.kubernetes.io/component: scheduler-metrics
    app.kubernetes.io/managed-by: kustomize
spec:
  type: ClusterIP
  selector:
    app: hiro-scheduler
  ports:
    - name: https
      port: 10259
      targetPort: 10259
      protocol: TCP
