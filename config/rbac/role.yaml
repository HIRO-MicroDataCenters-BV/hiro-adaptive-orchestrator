  - nodes
  verbs:
  - get
- apiGroups:
  - orchestration.hiro.io
  resources:
  - orchestrationprofiles
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - orchestration.hiro.io
  resources:
  - orchestrationprofiles/finalizers
  verbs:
  - update
- apiGroups:
  - orchestration.hiro.io
  resources:
  - orchestrationprofiles/status
  verbs:
  - get
  - patch
  - update
