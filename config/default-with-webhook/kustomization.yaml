apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Overlay: base operator + scheduler webhook (cert-manager TLS).
# Use when DEPLOY_SCHEDULER_PLUGIN=true:
#   make deploy-scheduler IMG=<image>
#
# PREREQUISITE: cert-manager must be installed before applying this.
# hack/deploy_full_stack.sh installs it in Phase 0 when DEPLOY_SCHEDULER_PLUGIN=true.
#
# Differences from config/default:
#   + config/webhook     — webhook Service + MutatingWebhookConfiguration
#   + config/certmanager — self-signed Issuer + TLS Certificates
#   + manager_webhook_patch.yaml — cert volume mount + port 9443 on operator Deployment
#   + replacements       — populate Certificate dnsNames and MWC CA annotation from
#                          actual resource names (no hardcoded values)

# Same namespace and namePrefix as config/default.
namespace: hiro-adaptive-orchestrator-system
namePrefix: hiro-adaptive-orchestrator-

resources:
- ../crd
- ../rbac
- ../manager
- ../webhook
- ../certmanager
#- ../network-policy

# [METRICS] Shared component: adds metrics Service + enables HTTPS :8443 endpoint.
# [WEBHOOK-PATCH] Adds cert volume mount, port 9443, and --webhook-cert-path arg to the Deployment.
components:
- ../components/metrics

patches:
# [WEBHOOK] Mount the cert-manager Secret (optional) and expose port 9443.
# optional: true means the pod starts safely before cert-manager issues the cert.
- path: manager_webhook_patch.yaml
  target:
    kind: Deployment

# ── Parameterized replacements ────────────────────────────────────────────────
#
# kustomize reads the actual post-transformation values (after namePrefix and
# namespace are applied) and substitutes them into the placeholder fields.
# No hardcoded names or namespaces anywhere in this file.
#
# Certificate placeholder format:  SERVICE_NAME.SERVICE_NAMESPACE.svc[.cluster.local]
# MWC annotation placeholder:      CERT_NAMESPACE/CERT_NAME
#
replacements:

# ── Webhook Certificate dnsNames ─────────────────────────────────────────────
# Read the webhook Service name (post-namePrefix) and namespace (post-namespace)
# and write them into the two dnsNames of the webhook Certificate.
- source:
    kind: Service
    version: v1
    name: webhook-service
    fieldPath: .metadata.name
  targets:
  - select:
      kind: Certificate
      group: cert-manager.io
      version: v1
      name: serving-cert
    fieldPaths:
    - .spec.dnsNames.0
    - .spec.dnsNames.1
    options:
      delimiter: '.'
      index: 0
      create: true
- source:
    kind: Service
    version: v1
    name: webhook-service
    fieldPath: .metadata.namespace
  targets:
  - select:
      kind: Certificate
      group: cert-manager.io
      version: v1
      name: serving-cert
    fieldPaths:
    - .spec.dnsNames.0
    - .spec.dnsNames.1
    options:
      delimiter: '.'
      index: 1
      create: true

# ── Metrics Certificate dnsNames ─────────────────────────────────────────────
- source:
    kind: Service
    version: v1
    name: controller-manager-metrics-service
    fieldPath: .metadata.name
  targets:
  - select:
      kind: Certificate
      group: cert-manager.io
      version: v1
      name: metrics-certs
    fieldPaths:
    - .spec.dnsNames.0
    - .spec.dnsNames.1
    options:
      delimiter: '.'
      index: 0
      create: true
- source:
    kind: Service
    version: v1
    name: controller-manager-metrics-service
    fieldPath: .metadata.namespace
  targets:
  - select:
      kind: Certificate
      group: cert-manager.io
      version: v1
      name: metrics-certs
    fieldPaths:
    - .spec.dnsNames.0
    - .spec.dnsNames.1
    options:
      delimiter: '.'
      index: 1
      create: true

# ── MutatingWebhookConfiguration CA injection annotation ─────────────────────
# cert-manager ca-injector reads cert-manager.io/inject-ca-from: <ns>/<cert-name>
# and injects the CA bundle automatically.  Read both fields from the Certificate
# resource itself so they always match after namePrefix/namespace transforms.
- source:
    kind: Certificate
    group: cert-manager.io
    version: v1
    name: serving-cert
    fieldPath: .metadata.namespace
  targets:
  - select:
      kind: MutatingWebhookConfiguration
    fieldPaths:
    - .metadata.annotations.[cert-manager.io/inject-ca-from]
    options:
      delimiter: '/'
      index: 0
      create: true
- source:
    kind: Certificate
    group: cert-manager.io
    version: v1
    name: serving-cert
    fieldPath: .metadata.name
  targets:
  - select:
      kind: MutatingWebhookConfiguration
    fieldPaths:
    - .metadata.annotations.[cert-manager.io/inject-ca-from]
    options:
      delimiter: '/'
      index: 1
      create: true
