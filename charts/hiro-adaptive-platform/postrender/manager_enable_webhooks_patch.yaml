# Strategic-merge patch (not JSON6902): matches env's patchMergeKey (name)
# and overwrites manager.env's static "false" default in place, instead of
# appending a second entry — a duplicate name is fine for `helm install`
# but makes `helm upgrade` fail its patch computation.
#
# Unconditional on purpose — the operator may briefly CrashLoopBackOff until
# cert-manager issues the cert, which `helm ... --wait --timeout` tolerates.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: manager-enable-webhooks-patch-target
spec:
  template:
    spec:
      containers:
        - name: manager
          env:
            - name: ENABLE_WEBHOOKS
              value: "true"
