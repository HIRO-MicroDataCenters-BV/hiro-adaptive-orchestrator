{{- if .Values.samples.enabled }}
# Sample OrchestrationProfile CRs (cluster-scoped), for demos/eval — matches
# config/samples/, applied unconditionally by hack/deploy_operator.sh today;
# this chart makes it opt-in instead (off by default) since a production
# install shouldn't get demo workloads by default.
#
# targetDeploymentName is a plain string reference (applicationRef), not a
# resource this file creates — it must match the actual Deployment name set
# in nginx-deployment-1.yaml's samples.nginxApp1.deploymentName. values.yaml
# can't cross-reference itself, so keep the two in sync by hand if you
# rename either.
#
# rebalancing.enabled/dryRun are per-CR spec fields (not operator env vars
# — see hiro-operator.manager.env's own comment), applied uniformly to all
# samples via samples.rebalancing.*.
apiVersion: orchestration.hiro.io/v1alpha1
kind: OrchestrationProfile
metadata:
  name: {{ .Values.samples.profileSample.name }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  applicationRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ .Values.samples.profileSample.targetDeploymentName }}
    namespace: {{ .Values.samples.namespace }}
  placement:
    strategy: Spread
    awareness:
      cpu: false
      memory: false
      gpu: false
      energy: true
  rebalancing:
    enabled: {{ .Values.samples.rebalancing.enabled }}
    dryRun: {{ .Values.samples.rebalancing.dryRun }}
    cooldownSeconds: 300
    triggerConditions:
      - "EnergyThreshold"
{{- end }}
