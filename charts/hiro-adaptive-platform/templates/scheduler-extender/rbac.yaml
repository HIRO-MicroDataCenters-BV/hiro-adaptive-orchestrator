{{- /*
NOT gated by scheduler.mode == "extender" like the rest of
templates/scheduler-extender/ — the restore/cleanup hook Jobs
(job-restore-kube-scheduler.yaml) need this ServiceAccount to still exist
when switching AWAY from extender mode (mode is something else by then,
that's the pre-upgrade hook case). RBAC is cheap and harmless to always
render regardless of mode, so keeping it unconditional avoids having to
keep two different gating conditions in sync.
*/}}
# One ServiceAccount shared by all extender-related hook Jobs (prep, patch,
# verify, restore, cleanup). The patch/restore Jobs are privileged and only
# ever touch the control-plane node's filesystem via hostPath — they make no
# Kubernetes API calls, so they don't actually need any of the RBAC below,
# but reuse this same ServiceAccount for simplicity rather than a separate
# unbound one.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-hiro-extender
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: hiro-extender
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/instance: {{ .Release.Name }}
---
# Prep Job: resolve the PlacementServer Service's ClusterIP (by label
# selector, in this release's own namespace).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-hiro-extender
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: hiro-extender
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/instance: {{ .Release.Name }}
rules:
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-hiro-extender
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: hiro-extender
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/instance: {{ .Release.Name }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-hiro-extender
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-hiro-extender
    namespace: {{ .Release.Namespace }}
---
# Prep Job (create/update the two ConfigMaps) and wait/verify Job (poll the
# kube-scheduler pod for its restart) both need access in kube-system — a
# different namespace than this release's own, so this Role+RoleBinding
# pair lives there instead, referencing the ServiceAccount above as a
# cross-namespace subject (standard Kubernetes RBAC pattern).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-hiro-extender
  namespace: kube-system
  labels:
    app.kubernetes.io/name: hiro-extender
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/instance: {{ .Release.Name }}
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "create", "update", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-hiro-extender
  namespace: kube-system
  labels:
    app.kubernetes.io/name: hiro-extender
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/instance: {{ .Release.Name }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-hiro-extender
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-hiro-extender
    namespace: {{ .Release.Namespace }}
