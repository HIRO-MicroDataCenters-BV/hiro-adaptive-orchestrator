{{- if eq .Values.scheduler.mode "plugin" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-hiro-scheduler
  namespace: {{ .Release.Namespace }}
  labels:
    app: hiro-scheduler
    app.kubernetes.io/name: hiro-scheduler
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.scheduler.plugin.replicas }}
  selector:
    matchLabels:
      app: hiro-scheduler
  template:
    metadata:
      labels:
        app: hiro-scheduler
        app.kubernetes.io/name: hiro-scheduler
    spec:
      serviceAccountName: {{ .Release.Name }}-hiro-scheduler
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: hiro-scheduler
          image: "{{ .Values.scheduler.plugin.image.repository }}:{{ required "scheduler.plugin.image.tag must be set when scheduler.mode=plugin (no safe default — see values.yaml comment)" .Values.scheduler.plugin.image.tag }}"
          imagePullPolicy: {{ .Values.scheduler.plugin.image.pullPolicy }}
          command:
            - /usr/local/bin/hiro-scheduler
          args:
            - --config=/etc/kubernetes/hiro-scheduler/scheduler-config.yaml
            - --v=2
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: scheduler-config
              mountPath: /etc/kubernetes/hiro-scheduler
              readOnly: true
          livenessProbe:
            httpGet:
              path: /healthz
              port: 10259
              scheme: HTTPS
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: 10259
              scheme: HTTPS
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.scheduler.plugin.resources | nindent 12 }}
      volumes:
        - name: scheduler-config
          configMap:
            name: {{ .Release.Name }}-hiro-scheduler-config
      terminationGracePeriodSeconds: 10
{{- end }}
