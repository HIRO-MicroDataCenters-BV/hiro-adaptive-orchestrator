name: Deploy Full-Platform Chart
#
# Deploys charts/hiro-adaptive-platform to a REAL target cluster — not a
# throwaway Kind cluster (that's verify-chart-platform.yml). Runs after a PR
# merges to main, or on demand via the "Run workflow" button.
#
# Images are built here and pushed to GHCR (this repo's own package
# registry) using the built-in GITHUB_TOKEN — no separate registry
# credential to manage. The target cluster's kubeconfig comes from the
# TARGET_KUBECONFIG repo secret (masked in logs, unlike a repo Variable).
#
# helm upgrade uses --reuse-values, so a run only needs to specify what's
# actually changing (here: the two image tags) — it won't silently reset
# every other value on the live release back to values.yaml's defaults the
# way a plain `helm upgrade` would. Use the "extra_helm_args" manual-trigger
# input for anything else that needs changing for a given run.
#
# ─── Repo Secrets ─────────────────────────────────────────────────────────
#   TARGET_KUBECONFIG      Required. Base64-encoded kubeconfig for the
#                          target cluster (`kubectl config view --raw | base64`).
#                          Used by deploy-target-cluster.
#   GITHUB_TOKEN           Built-in, provided automatically by Actions — not
#                          something you configure. Used to push to GHCR.
#   DOCKERHUB_USERNAME     Only needed if you switch to the commented-out
#   DOCKERHUB_PASSWORD     Docker Hub build-push jobs below instead of GHCR.
#
# ─── Repo Variables ────────────────────────────────────────────────────────
# Unlike the manual-trigger input below, these apply on every run regardless
# of trigger — including the automatic push-to-main deploy, which has no
# inputs to fill in. All optional; each defaults to this chart's own
# values.yaml default (i.e. unset here = feature off) if not set.
#   TARGET_NAMESPACE            k8s namespace for the release  (default: hiro-adaptive-orchestrator-system)
#   TARGET_RELEASE_NAME         Helm release name              (default: hiro-adaptive-platform)
#   SCHEDULER_MODE               none | plugin | extender        (default: none)
#   WEBHOOK_ENABLE                true | false                    (default: false)
#   WEBHOOK_CERT_MANAGER_ENABLE   true | false                    (default: false)
#   PREREQ_CERT_MANAGER_ENABLE    true | false                    (default: false)
#   MOCK_AGENT_ENABLE             true | false                    (default: false)
#   HELM_EXTRA_VALUES             Catch-all for anything not covered by a
#                                 named variable above — raw --set/-f args,
#                                 applied on every run same as the others
#                                 (e.g. "--set samples.enabled=true").
#
# ─── Manual-trigger inputs (workflow_dispatch) ────────────────────────────
#   extra_helm_args        Optional. Extra --set/-f args appended to the
#                          helm upgrade command, layered on top of the repo
#                          Variables above — for a one-off override on a
#                          single run rather than a standing setting.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      extra_helm_args:
        description: "Extra --set/-f args appended to helm upgrade (e.g. --set scheduler.mode=plugin)"
        required: false
        default: ""

permissions:
  contents: read
  packages: write

jobs:
  # Stage 0 — parallel pre-flight gates.
  verify-secrets:
    name: Verify required secrets
    runs-on: ubuntu-latest
    steps:
      - name: Check TARGET_KUBECONFIG is set
        run: |
          if [ -z "${{ secrets.TARGET_KUBECONFIG }}" ]; then
            echo "::error::TARGET_KUBECONFIG secret is not set. Add it in repo Settings > Secrets and variables > Actions (base64-encoded kubeconfig — see header comment) before running this workflow."
            exit 1
          fi
          echo "TARGET_KUBECONFIG is set."

  # Same check as verify-chart-platform.yml's job of the same name.
  manifests-drift-check:
    name: Verify generated manifests are up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install kubebuilder v4.16.0
        run: |
          curl -Lo kubebuilder "https://github.com/kubernetes-sigs/kubebuilder/releases/download/v4.16.0/kubebuilder_$(go env GOOS)_$(go env GOARCH)"
          chmod +x kubebuilder
          sudo mv kubebuilder /usr/local/bin/kubebuilder

      - name: Install kustomize
        run: make kustomize

      - name: make manifests generate
        run: make manifests generate

      - name: Regenerate dist/chart
        run: |
          IMG_NAME=$(awk '/newName:/{print $2}' config/manager/kustomization.yaml)
          IMG_TAG=$(awk '/newTag:/{print $2}' config/manager/kustomization.yaml)
          export IMG="${IMG_NAME}:${IMG_TAG}"
          rm -rf dist
          kubebuilder edit --plugins=helm/v2-alpha --force

      - name: Fail if regeneration produced any diff
        run: |
          if ! git diff --exit-code -- config/ api/ dist/; then
            IMG_NAME=$(awk '/newName:/{print $2}' config/manager/kustomization.yaml)
            IMG_TAG=$(awk '/newTag:/{print $2}' config/manager/kustomization.yaml)
            echo "::error::Generated manifests/code are out of date (diff above). Run locally and commit:"
            echo ""
            echo "  make manifests generate"
            echo "  export IMG=${IMG_NAME}:${IMG_TAG}"
            echo "  rm -rf dist"
            echo "  kubebuilder edit --plugins=helm/v2-alpha --force"
            echo "  git add config api dist && git commit -m 'Regenerate manifests'"
            exit 1
          fi

  # Stage 1 — parallel, no cluster or images needed.
  helm-lint:
    name: Helm lint (umbrella chart)
    needs: [verify-secrets, manifests-drift-check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Helm
        run: make install-helm
      - name: helm lint
        run: make helm-platform-lint

  helm-template-check:
    name: Helm template-check (value combinations)
    needs: [verify-secrets, manifests-drift-check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Helm
        run: make install-helm
      - name: Install kustomize
        run: make kustomize
      - name: helm-platform-template-check
        run: make helm-platform-template-check

  # Stage 2 — needs stage 1. Builds run in parallel with each other.
  build-push-operator:
    name: Build + push operator image
    needs: [helm-lint, helm-template-check]
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.tag.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: tag
        run: echo "image=ghcr.io/${{ github.repository }}/hiro-adaptive-orchestrator-controller:sha-${{ github.sha }}" >> "$GITHUB_OUTPUT"
      - name: Build and push
        run: make docker-build docker-push IMG=${{ steps.tag.outputs.image }}

  build-push-scheduler:
    name: Build + push scheduler image
    needs: [helm-lint, helm-template-check]
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.tag.outputs.image }}
    env:
      SCHED_K8S_VERSION: v1.35.0
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: tag
        run: echo "image=ghcr.io/${{ github.repository }}/hiro-scheduler:sha-${{ github.sha }}-k8s${SCHED_K8S_VERSION}" >> "$GITHUB_OUTPUT"
      - name: Build and push
        run: |
          make docker-build-scheduler docker-push-scheduler \
            SCHED_IMG=ghcr.io/${{ github.repository }}/hiro-scheduler \
            SCHED_VERSION=sha-${{ github.sha }} \
            SCHED_K8S_VERSION=$SCHED_K8S_VERSION

  # Alternate stage 2 — Docker Hub instead of GHCR, using the
  # DOCKERHUB_USERNAME/DOCKERHUB_PASSWORD repo secrets (already configured).
  # Commented out — GHCR (above) is the active push target for now. To
  # switch: comment out build-push-operator/build-push-scheduler above,
  # uncomment these two, and update deploy-target-cluster's `needs:` and its
  # `needs.build-push-operator*`/`needs.build-push-scheduler*` references
  # below to point at these job names instead.
  #
  # build-push-operator-dockerhub:
  #   name: Build + push operator image (Docker Hub)
  #   needs: [helm-lint, helm-template-check]
  #   runs-on: ubuntu-latest
  #   outputs:
  #     image: ${{ steps.tag.outputs.image }}
  #   steps:
  #     - uses: actions/checkout@v4
  #     - name: Log in to Docker Hub
  #       uses: docker/login-action@v3
  #       with:
  #         username: ${{ secrets.DOCKERHUB_USERNAME }}
  #         password: ${{ secrets.DOCKERHUB_PASSWORD }}
  #     - id: tag
  #       run: echo "image=hiroregistry/hiro-adaptive-orchestrator-controller:sha-${{ github.sha }}" >> "$GITHUB_OUTPUT"
  #     - name: Build and push
  #       run: make docker-build docker-push IMG=${{ steps.tag.outputs.image }}
  #
  # build-push-scheduler-dockerhub:
  #   name: Build + push scheduler image (Docker Hub)
  #   needs: [helm-lint, helm-template-check]
  #   runs-on: ubuntu-latest
  #   outputs:
  #     image: ${{ steps.tag.outputs.image }}
  #   env:
  #     SCHED_K8S_VERSION: v1.35.0
  #   steps:
  #     - uses: actions/checkout@v4
  #     - name: Log in to Docker Hub
  #       uses: docker/login-action@v3
  #       with:
  #         username: ${{ secrets.DOCKERHUB_USERNAME }}
  #         password: ${{ secrets.DOCKERHUB_PASSWORD }}
  #     - id: tag
  #       run: echo "image=hiroregistry/hiro-scheduler:sha-${{ github.sha }}-k8s${SCHED_K8S_VERSION}" >> "$GITHUB_OUTPUT"
  #     - name: Build and push
  #       run: |
  #         make docker-build-scheduler docker-push-scheduler \
  #           SCHED_IMG=hiroregistry/hiro-scheduler \
  #           SCHED_VERSION=sha-${{ github.sha }} \
  #           SCHED_K8S_VERSION=$SCHED_K8S_VERSION

  # Stage 3 — needs both builds. Deploys to the real target cluster.
  deploy-target-cluster:
    name: Deploy to target cluster
    needs: [build-push-operator, build-push-scheduler]
    runs-on: ubuntu-latest
    env:
      HELM_NAMESPACE: ${{ vars.TARGET_NAMESPACE || 'hiro-adaptive-orchestrator-system' }}
      HELM_PLATFORM_RELEASE: ${{ vars.TARGET_RELEASE_NAME || 'hiro-adaptive-platform' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Helm
        run: make install-helm

      - name: Install kustomize
        run: make kustomize

      - name: Write kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.TARGET_KUBECONFIG }}" | base64 -d > "$HOME/.kube/config"
        # TARGET_KUBECONFIG is expected base64-encoded, matching how
        # `kubectl config view --raw | base64` produces it — avoids any
        # multi-line-secret formatting issues in the GitHub UI.

      # scheduler.plugin.placementServer.url has no default — the operator's
      # Service name can't be known before the operator exists — so
      # SCHEDULER_MODE=plugin can't go in on the very first deploy. This
      # step sets everything EXCEPT scheduler.mode/webhook when plugin mode
      # is requested; phases 2/3 below fill those in once the Service is
      # live. For none/extender (no such dependency) it sets scheduler.mode
      # directly and is the only deploy step that runs.
      - name: Deploy charts/hiro-adaptive-platform (phase 1)
        run: |
          export KUBECONFIG="$HOME/.kube/config"
          IMAGE_REPO="${{ needs.build-push-operator.outputs.image }}"
          SCHED_REPO="${{ needs.build-push-scheduler.outputs.image }}"
          SCHED_MODE="${{ vars.SCHEDULER_MODE || 'none' }}"
          EXTRA_ARGS="\
            --reuse-values \
            --set hiro-operator.manager.image.repository=${IMAGE_REPO%%:*} \
            --set hiro-operator.manager.image.tag=${IMAGE_REPO##*:} \
            --set scheduler.plugin.image.repository=${SCHED_REPO%%:*} \
            --set scheduler.plugin.image.tag=${SCHED_REPO##*:} \
            --set prerequisites.certManager.enable=${{ vars.PREREQ_CERT_MANAGER_ENABLE || 'false' }} \
            --set mockAgent.enable=${{ vars.MOCK_AGENT_ENABLE || 'false' }} \
            ${{ vars.HELM_EXTRA_VALUES }} \
            ${{ inputs.extra_helm_args }}"
          if [ "$SCHED_MODE" != "plugin" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --set scheduler.mode=$SCHED_MODE --set webhook.enable=false"
          fi
          make helm-platform-deploy \
            HELM_NAMESPACE=$HELM_NAMESPACE \
            HELM_PLATFORM_RELEASE=$HELM_PLATFORM_RELEASE \
            HELM_EXTRA_ARGS="$EXTRA_ARGS"

      # Same lookup charts/hiro-adaptive-platform/README.md documents doing
      # by hand: find the PlacementServer Service by label now that it exists.
      - name: Resolve PlacementServer Service
        if: vars.SCHEDULER_MODE == 'plugin'
        run: |
          export KUBECONFIG="$HOME/.kube/config"
          SVC=$(kubectl -n $HELM_NAMESPACE get svc \
            -l app.kubernetes.io/component=placement-server \
            -o jsonpath='{.items[0].metadata.name}')
          echo "PLACEMENT_SERVER_URL=http://${SVC}.${HELM_NAMESPACE}.svc.cluster.local:8090" >> "$GITHUB_ENV"

      # Phase 2: only runs for SCHEDULER_MODE=plugin, once
      # PLACEMENT_SERVER_URL is known. --reuse-values keeps phase 1's
      # settings (image tags, mockAgent, cert-manager) intact.
      - name: Deploy charts/hiro-adaptive-platform (phase 2 — scheduler + webhook)
        if: vars.SCHEDULER_MODE == 'plugin'
        run: |
          export KUBECONFIG="$HOME/.kube/config"
          make helm-platform-deploy \
            HELM_NAMESPACE=$HELM_NAMESPACE \
            HELM_PLATFORM_RELEASE=$HELM_PLATFORM_RELEASE \
            HELM_EXTRA_ARGS="\
              --reuse-values \
              --set scheduler.mode=plugin \
              --set scheduler.plugin.placementServer.url=$PLACEMENT_SERVER_URL \
              --set webhook.enable=${{ vars.WEBHOOK_ENABLE || 'false' }} \
              --set webhook.certManager.enable=${{ vars.WEBHOOK_CERT_MANAGER_ENABLE || 'false' }}"

      - name: Show release status
        if: always()
        run: |
          export KUBECONFIG="$HOME/.kube/config"
          make helm-platform-status
