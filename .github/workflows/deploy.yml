name: Deploy to Target Cluster
#
# Triggered when release.yml publishes a GitHub Release, or manually for a
# redeploy of a past version without rebuilding anything. Deploys the chart
# and images exactly as release.yml published them to GHCR — no checkout of
# this repo, no dependency on its Makefile. Deliberate: this job should look
# like what an external CD tool (ArgoCD, Flux, Jenkins) would eventually do
# against the same published artifacts, not a repo-specific script.
#
# ─── Secrets ────────────────────────────────────────────────────────────
#   TARGET_KUBECONFIG   Required. Base64-encoded kubeconfig for the target
#                       cluster (`kubectl config view --raw | base64`).
#   GITHUB_TOKEN        Built-in, provided automatically by Actions. Used to
#                       pull the chart from GHCR.
#
# ─── Repo Variables (Settings > Secrets and variables > Actions) ────────
#   TARGET_NAMESPACE             k8s namespace for the release  (default: hiro-adaptive-orchestrator-system)
#   TARGET_RELEASE_NAME          Helm release name              (default: hiro-adaptive-platform)
#   SCHED_K8S_VERSION            Scheduler image's target K8s minor version (default: v1.35.0)
#   SCHEDULER_MODE                none | plugin | extender        (default: none)
#   WEBHOOK_ENABLE                true | false                    (default: false)
#   WEBHOOK_TLS_MODE              helm | certManager | existingSecret (default: helm)
#   PREREQ_METRICS_SERVER_ENABLE  true | false                    (default: false)
#   PREREQ_PROMETHEUS_ENABLE      true | false                    (default: false)
#   MOCK_AGENT_ENABLE             true | false                    (default: false)
#   AI_DECISION_SERVICE_ENABLE    true | false                    (default: false)
#   HELM_EXTRA_VALUES             Catch-all extra --set/-f args, applied on every run
#
# ─── workflow_dispatch input ─────────────────────────────────────────────
#   version   Required for a manual run. Version tag to deploy (e.g. v1.4.0).

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to deploy (e.g. v1.4.0)"
        required: true

permissions:
  contents: read
  packages: read

env:
  SCHED_K8S_VERSION: ${{ vars.SCHED_K8S_VERSION || 'v1.35.0' }}
  CHART_NAME: hiro-adaptive-platform

jobs:
  verify-secrets:
    name: Verify required secrets
    runs-on: ubuntu-latest
    steps:
      - name: Check TARGET_KUBECONFIG is set
        run: |
          if [ -z "${{ secrets.TARGET_KUBECONFIG }}" ]; then
            echo "::error::TARGET_KUBECONFIG secret is not set. Add it in repo Settings > Secrets and variables > Actions (base64-encoded kubeconfig) before running this workflow."
            exit 1
          fi

  deploy-target-cluster:
    name: Deploy to target cluster
    needs: verify-secrets
    runs-on: ubuntu-latest
    env:
      HELM_NAMESPACE: ${{ vars.TARGET_NAMESPACE || 'hiro-adaptive-orchestrator-system' }}
      HELM_PLATFORM_RELEASE: ${{ vars.TARGET_RELEASE_NAME || 'hiro-adaptive-platform' }}
      VERSION: ${{ github.event.release.tag_name || inputs.version }}
    steps:
      - name: Compute lowercase repo
        run: echo "GHCR_REPO_LC=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Install Helm
        run: |
          major=$(helm version --template '{{.Version}}' 2>/dev/null | sed -E 's/^v([0-9]+).*/\1/')
          if [ -z "$major" ] || [ "$major" -lt 4 ]; then
            curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-4 | bash
          fi

      - name: Write kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.TARGET_KUBECONFIG }}" | base64 -d > "$HOME/.kube/config"

      - name: Pull released chart
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin
          CHART_REF="oci://ghcr.io/$GHCR_REPO_LC/charts/$CHART_NAME"
          helm pull "$CHART_REF" --version "${VERSION#v}" --untar --destination release-chart

      - name: Check prerequisites against target cluster
        env:
          WEBHOOK_ENABLE: ${{ vars.WEBHOOK_ENABLE || 'false' }}
          WEBHOOK_TLS_MODE: ${{ vars.WEBHOOK_TLS_MODE || 'helm' }}
          PREREQ_METRICS_SERVER_ENABLE: ${{ vars.PREREQ_METRICS_SERVER_ENABLE || 'false' }}
          PREREQ_PROMETHEUS_ENABLE: ${{ vars.PREREQ_PROMETHEUS_ENABLE || 'false' }}
        run: |
          export KUBECONFIG="$HOME/.kube/config"

          # webhook.tls.mode=certManager: hard failure. The webhook's TLS cert
          # is issued by cert-manager's Issuer/Certificate CRs (see
          # templates/certmanager/); with no cert-manager in the cluster those
          # never get reconciled, the webhook never gets a valid cert, and
          # admission can break cluster-wide. The default, mode=helm, needs
          # nothing installed.
          if [ "$WEBHOOK_ENABLE" = "true" ] && [ "$WEBHOOK_TLS_MODE" = "certManager" ]; then
            if ! kubectl get crd certificates.cert-manager.io >/dev/null 2>&1; then
              echo "::error::webhook.tls.mode=certManager, but no cert-manager was found on the target cluster (missing CRD certificates.cert-manager.io). Install cert-manager first, or use WEBHOOK_TLS_MODE=helm."
              exit 1
            fi
          fi

          # metricsServer: soft warning. internal/rebalance/pressure.go returns
          # a descriptive per-call error when metrics.k8s.io is unreachable —
          # the operator keeps running, only CPU/Memory pressure triggers degrade.
          if [ "$PREREQ_METRICS_SERVER_ENABLE" != "true" ]; then
            if ! kubectl get apiservice v1beta1.metrics.k8s.io >/dev/null 2>&1; then
              echo "::warning::prerequisites.metricsServer.enable=false and no metrics-server was found on the target cluster (missing APIService v1beta1.metrics.k8s.io). The rebalance engine's CPU/Memory pressure triggers will error out until metrics-server is available. Fix: set PREREQ_METRICS_SERVER_ENABLE=true, or install metrics-server on the target cluster yourself."
            fi
          fi

          # prometheus: informational only. Nothing in the operator depends on
          # Prometheus internally — it's just a scrape target for monitoring.
          if [ "$PREREQ_PROMETHEUS_ENABLE" != "true" ]; then
            if ! kubectl get crd servicemonitors.monitoring.coreos.com >/dev/null 2>&1; then
              echo "::notice::prerequisites.prometheus.enable=false and no Prometheus Operator was found on the target cluster (missing CRD servicemonitors.monitoring.coreos.com). This only affects metrics scraping — the stack itself will run normally without it."
            fi
          fi

      - name: Deploy deploy/helm/hiro-adaptive-platform
        run: |
          export KUBECONFIG="$HOME/.kube/config"
          ORCHESTRATOR_IMAGE_REPO="ghcr.io/$GHCR_REPO_LC/hiro-adaptive-orchestrator-controller:${VERSION}"
          SCHED_IMAGE_REPO="ghcr.io/$GHCR_REPO_LC/hiro-scheduler:${VERSION}-k8s${SCHED_K8S_VERSION}"
          AI_DECISION_SERVICE_IMAGE_REPO="ghcr.io/$GHCR_REPO_LC/ai-decision-service:${VERSION}"
          SCHED_MODE="${{ vars.SCHEDULER_MODE || 'none' }}"
          WEBHOOK_ENABLE="${{ vars.WEBHOOK_ENABLE || 'false' }}"
          # The webhook only exists in plugin mode.
          if [ "$SCHED_MODE" != "plugin" ]; then WEBHOOK_ENABLE=false; fi
          helm upgrade --install "$HELM_PLATFORM_RELEASE" "release-chart/$CHART_NAME" \
            --namespace "$HELM_NAMESPACE" \
            --create-namespace \
            --wait \
            --timeout 10m \
            --set hiro-operator.manager.image.repository=${ORCHESTRATOR_IMAGE_REPO%%:*} \
            --set hiro-operator.manager.image.tag=${ORCHESTRATOR_IMAGE_REPO##*:} \
            --set scheduler.plugin.image.repository=${SCHED_IMAGE_REPO%%:*} \
            --set scheduler.plugin.image.tag=${SCHED_IMAGE_REPO##*:} \
            --set scheduler.mode=$SCHED_MODE \
            --set webhook.enable=$WEBHOOK_ENABLE \
            --set webhook.tls.mode=${{ vars.WEBHOOK_TLS_MODE || 'helm' }} \
            --set prerequisites.metricsServer.enable=${{ vars.PREREQ_METRICS_SERVER_ENABLE || 'false' }} \
            --set prerequisites.prometheus.enable=${{ vars.PREREQ_PROMETHEUS_ENABLE || 'false' }} \
            --set mockAgent.enable=${{ vars.MOCK_AGENT_ENABLE || 'false' }} \
            --set aiDecisionService.image.repository=${AI_DECISION_SERVICE_IMAGE_REPO%%:*} \
            --set aiDecisionService.image.tag=${AI_DECISION_SERVICE_IMAGE_REPO##*:} \
            --set aiDecisionService.enable=${{ vars.AI_DECISION_SERVICE_ENABLE || 'false' }} \
            ${{ vars.HELM_EXTRA_VALUES }}

      - name: Show release status
        if: always()
        run: |
          export KUBECONFIG="$HOME/.kube/config"
          helm status "$HELM_PLATFORM_RELEASE" --namespace "$HELM_NAMESPACE"